<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="키오스크 두 대를 직접 써 보며 다양성·정확성, 심미성·접근성, 공정성·비용을 비교하는 밸런스 게임"
    />
    <meta name="theme-color" content="#eeefed" />
    <title>말맛식당 · 주문 키오스크</title>
    <link rel="preload" href="/assets/balance/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/balance.css" />
    <link rel="stylesheet" href="/balance-surface.css" />
    <link rel="stylesheet" href="/balance-hardware.css" />
    <link rel="stylesheet" href="/balance-card.css" />
    <link rel="stylesheet" href="/balance-themes.css" />
    <link rel="stylesheet" href="/balance-stages.css" />
    <script src="/balance-card.js" defer></script>
    <script src="/balance.js" defer></script>
  </head>
  <body>
    <button id="overviewBack" class="overview-back" type="button" hidden>
      <span aria-hidden="true">←</span> 돌아가기
    </button>
    <nav id="stageNav" class="stage-nav" aria-label="밸런스 게임 단계"></nav>
    <section id="stageGate" class="stage-gate" hidden></section>
    <aside id="mission" class="mission-card" aria-label="주문 미션"></aside>
    <main class="kiosk-stage" aria-label="주문 키오스크 두 대">
      <article
        id="kioskA"
        class="terminal terminal-legacy"
        aria-label="A 주문 키오스크"
      ></article>
      <article
        id="kioskB"
        class="terminal terminal-modern"
        aria-label="B 주문 키오스크"
      ></article>
    </main>
  </body>
</html>
